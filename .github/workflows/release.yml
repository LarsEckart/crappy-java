name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          if [[ -z "$version" || "$version" == *-SNAPSHOT ]]; then
            echo "Release tags must name a non-SNAPSHOT version, for example v0.1.0." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -PreleaseVersion="${{ steps.version.outputs.value }}"

      - name: Validate Plugin Portal publication
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :gradle-plugin:publishPlugins --validate-only -PreleaseVersion="${{ steps.version.outputs.value }}"

  publish-core:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish core to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew :core:publishAndReleaseToMavenCentral -PreleaseVersion="${{ needs.validate.outputs.release_version }}"

  await-core:
    needs: [validate, publish-core]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for crappy-java-core to reach Maven Central
        env:
          VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          url="https://repo.maven.apache.org/maven2/com/larseckart/crappy-java-core/$VERSION/crappy-java-core-$VERSION.pom"
          for attempt in {1..60}; do
            if curl --fail --location --silent --show-error --head "$url"; then
              exit 0
            fi
            echo "crappy-java-core is not available yet (attempt $attempt/60); waiting 10 seconds"
            sleep 10
          done
          echo "crappy-java-core did not become available from Maven Central: $url" >&2
          exit 1

  publish-plugin:
    needs: [validate, await-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish to the Gradle Plugin Portal
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :gradle-plugin:publishPlugins -PreleaseVersion="${{ needs.validate.outputs.release_version }}"

  smoke:
    needs: [validate, publish-plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Smoke-test the released plugin
        env:
          VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          for attempt in {1..30}; do
            if ./scripts/smoke-released-plugin.sh "$VERSION"; then
              exit 0
            fi
            echo "plugin is not available yet (attempt $attempt/30); waiting 10 seconds"
            sleep 10
          done
          echo "The released plugin did not resolve from the default Plugin Portal setup." >&2
          exit 1
